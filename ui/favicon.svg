<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- GlobalArchive mark, favicon variant for ~16 px rendering: three bands, no meridians,
       heavier strokes, enlarged eye. The fish interior is transparent (mask-punched).
       Favicon-specific ink rules below (see the style block). Source of the geometry:
       brand/logo/globalarchive-mark-16.svg. -->
  <style>
    /* Default ink: Current, a mid-tone that reads on light and dark tab strips alike. A light
       rule refines it to Abyss where the browser genuinely evaluates a light scheme for
       favicons (Firefox does). There is deliberately no dark rule: Chromium's favicon
       rasteriser reports a dark scheme regardless of the real theme (crbug 1311553; measured
       2026-09-23), so a dark rule would hand light-theme Chromium users the light-on-light
       ink. Chromium therefore always gets the mid-tone default. */
    .ga-ink { stroke: #2E7E9E; }
    .ga-eye { fill: #2E7E9E; }
    @media (prefers-color-scheme: light) { .ga-ink { stroke: #123B54; } .ga-eye { fill: #123B54; } }
  </style>
  <defs>
    <clipPath id="ga-mark16-globe"><circle cx="42" cy="48" r="28"/></clipPath>
    <mask id="ga-mark16-fish" maskUnits="userSpaceOnUse" x="0" y="0" width="96" height="96">
      <rect width="96" height="96" fill="#fff"/>
      <g transform="translate(21 9) scale(0.82)">
        <path d="M14 48 C14 37 26 28 42 28 C54 28 63 34 67 42 L82 30 L77 48 L82 66 L67 54 C63 62 54 68 42 68 C26 68 14 59 14 48 Z" fill="#000" stroke="#000" stroke-width="4.5" stroke-linejoin="round"/>
      </g>
    </mask>
  </defs>
  <g mask="url(#ga-mark16-fish)">
    <g clip-path="url(#ga-mark16-globe)">
      <rect x="12" y="18" width="60" height="16.6" fill="#A8D4E2"/>
      <rect x="12" y="39.7" width="60" height="16.6" fill="#2E7E9E"/>
      <rect x="12" y="61.4" width="60" height="16.6" fill="#123B54"/>
    </g>
    <circle cx="42" cy="48" r="30" fill="none" class="ga-ink" stroke-width="6"/>
  </g>
  <g transform="translate(21 9) scale(0.82)">
    <path d="M14 48 C14 37 26 28 42 28 C54 28 63 34 67 42 L82 30 L77 48 L82 66 L67 54 C63 62 54 68 42 68 C26 68 14 59 14 48 Z" fill="none" class="ga-ink" stroke-width="4.5" stroke-linejoin="round"/>
    <circle cx="26" cy="42" r="4.5" class="ga-eye"/>
  </g>
</svg>
