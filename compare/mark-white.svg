<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- GlobalArchive mark, dark-surface variant. Meridian cuts and the fish interior are
       transparent (mask-punched), so the mark sits on any dark background. -->
  <defs>
    <clipPath id="ga-mark-dark-globe"><circle cx="42" cy="48" r="28"/></clipPath>
    <mask id="ga-mark-dark-cuts" maskUnits="userSpaceOnUse" x="0" y="0" width="96" height="96">
      <rect width="96" height="96" fill="#fff"/>
      <g fill="none" stroke="#000" stroke-width="2">
        <line x1="42" y1="18" x2="42" y2="78"/>
        <ellipse cx="42" cy="48" rx="13.5" ry="30"/>
      </g>
    </mask>
    <mask id="ga-mark-dark-fish" maskUnits="userSpaceOnUse" x="0" y="0" width="96" height="96">
      <rect width="96" height="96" fill="#fff"/>
      <g transform="translate(21 9) scale(0.82)">
        <path d="M14 48 C14 37 26 28 42 28 C54 28 63 34 67 42 L82 30 L77 48 L82 66 L67 54 C63 62 54 68 42 68 C26 68 14 59 14 48 Z" fill="#000" stroke="#000" stroke-width="3.4" stroke-linejoin="round"/>
      </g>
    </mask>
  </defs>
  <g mask="url(#ga-mark-dark-fish)">
    <g clip-path="url(#ga-mark-dark-globe)" mask="url(#ga-mark-dark-cuts)">
      <rect x="12" y="18" width="60" height="13.5" fill="#A8D4E2"/>
      <rect x="12" y="33.5" width="60" height="13.5" fill="#2E7E9E"/>
      <rect x="12" y="49" width="60" height="13.5" fill="#1B5674"/>
      <rect x="12" y="64.5" width="60" height="13.5" fill="#123B54"/>
    </g>
    <circle cx="42" cy="48" r="30" fill="none" stroke="#fff" stroke-width="4.5"/>
  </g>
  <g transform="translate(21 9) scale(0.82)">
    <path d="M14 48 C14 37 26 28 42 28 C54 28 63 34 67 42 L82 30 L77 48 L82 66 L67 54 C63 62 54 68 42 68 C26 68 14 59 14 48 Z" fill="none" stroke="#fff" stroke-width="3.4" stroke-linejoin="round"/>
    <circle cx="26" cy="42" r="3.2" fill="#fff"/>
  </g>
</svg>
